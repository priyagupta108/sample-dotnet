name: "Test rollForward combined with other inputs"

on:
  push:
  workflow_dispatch:

jobs:

  # ══════════════════════════════════════════════════════════════════
  # COMBO 1 — rollForward latestMinor + dotnet-quality: ga
  # Question: does quality apply to the rolled-forward version?
  #
  # Expected behavior:
  #   global.json version  → resolved by rollForward → installed (quality NOT applied)
  #   dotnet-quality: ga   → only applies to dotnet-version input, NOT global.json
  #
  # So quality is silently ignored for the global.json version
  # ══════════════════════════════════════════════════════════════════
  combo1-rollforward-latestMinor-quality-ga:
    name: "rollForward latestMinor + quality:ga | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: echo '{"sdk":{"version":"3.0.100","rollForward":"latestMinor"}}' > global.json

      - name: Setup dotnet (PR #538) + quality ga
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./global.json
          dotnet-quality: 'ga'
          # quality:ga applies to dotnet-version input only
          # global.json rollForward is independent — should still give 3.1.xxx

      - name: Assert 3.1.xxx installed (rollForward worked despite quality input)
        shell: bash
        run: |
          V=$(dotnet --version)
          if [[ ! "$V" =~ ^3\.1\. ]]; then
            echo "❌ Expected 3.1.xxx but got $V"; exit 1
          fi
          echo "✅ $V — rollForward worked, quality:ga did not interfere"

  # ══════════════════════════════════════════════════════════════════
  # COMBO 2 — rollForward latestFeature + dotnet-quality: preview
  # Question: does preview quality bleed into global.json resolution?
  #
  # Expected behavior:
  #   global.json 8.0.100 + latestFeature → 8.0.xxx stable
  #   dotnet-quality: preview → only applies to dotnet-version, NOT here
  #   So result should still be stable 8.0.xxx (no preview bleed)
  # ══════════════════════════════════════════════════════════════════
  combo2-rollforward-latestFeature-quality-preview:
    name: "rollForward latestFeature + quality:preview | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json

      - name: Setup dotnet (PR #538) + quality preview
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./global.json
          dotnet-quality: 'preview'

      - name: Assert 8.0.xxx (no preview bleed from quality)
        shell: bash
        run: |
          V=$(dotnet --version)
          echo "Installed: $V"
          if [[ ! "$V" =~ ^8\.0\. ]]; then
            echo "❌ Expected 8.0.xxx but got $V"; exit 1
          fi
          # If preview bled into global.json resolution, version would have hyphen
          if [[ "$V" == *"-"* ]]; then
            echo "⚠️ Got preview build $V — quality bled into global.json resolution!"
          else
            echo "✅ $V — stable, quality:preview did not bleed into global.json"
          fi
      - run: dotnet build SampleApp/SampleApp.csproj && dotnet run --project SampleApp/SampleApp.csproj

  # ══════════════════════════════════════════════════════════════════
  # COMBO 3 — rollForward latestPatch + dotnet-version: 9.0.x
  # Question: do both versions install side-by-side correctly?
  #
  # Expected behavior:
  #   global.json 8.0.100 + latestPatch → 8.0.1xx installed
  #   dotnet-version: 9.0.x             → 9.0.xxx installed
  #   Both present side-by-side
  # ══════════════════════════════════════════════════════════════════
  combo3-rollforward-latestPatch-plus-dotnetversion:
    name: "rollForward latestPatch + dotnet-version:9.0.x | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: echo '{"sdk":{"version":"8.0.100","rollForward":"latestPatch"}}' > global.json

      - name: Setup dotnet (PR #538) + explicit 9.0.x
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          dotnet-version: '9.0.x'
          global-json-file: ./global.json

      - name: Assert BOTH 8.0.1xx AND 9.0.xxx installed
        shell: bash
        run: |
          SDKS=$(dotnet --list-sdks)
          echo "All installed SDKs:"
          echo "$SDKS"

          if ! echo "$SDKS" | grep -qP "^8\.0\.1\d{2}"; then
            echo "❌ 8.0.1xx not found — rollForward latestPatch failed"; exit 1
          fi
          echo "✅ 8.0.1xx present"

          if ! echo "$SDKS" | grep -q "^9\.0\."; then
            echo "❌ 9.0.xxx not found — dotnet-version input failed"; exit 1
          fi
          echo "✅ 9.0.xxx present"
          echo "✅ Both installed side-by-side"

      - run: dotnet build SampleApp/SampleApp.csproj && dotnet run --project SampleApp/SampleApp.csproj

  # ══════════════════════════════════════════════════════════════════
  # COMBO 4 — rollForward latestMajor + dotnet-quality: ga
  # This specifically tests the latestMajor '' bug in PR #538
  # version='' hits DotnetVersionResolver with empty string → error
  #
  # Expected (ideal): installs latest GA major
  # Actual (PR #538 bug): cryptic error from version resolver
  # ══════════════════════════════════════════════════════════════════
  combo4-rollforward-latestMajor-quality-ga:
    name: "rollForward latestMajor + quality:ga (bug test) | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: echo '{"sdk":{"version":"3.1.100","rollForward":"latestMajor"}}' > global.json

      - name: Setup dotnet (PR #538) + quality ga
        id: setup
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./global.json
          dotnet-quality: 'ga'
        continue-on-error: true

      - name: Report latestMajor + quality behavior
        shell: bash
        run: |
          echo "Outcome: ${{ steps.setup.outcome }}"
          if [[ "${{ steps.setup.outcome }}" == "failure" ]]; then
            echo "❌ FAILS — confirms latestMajor sets version='' bug in PR #538"
            echo "   DotnetVersionResolver throws: invalid format ''"
            exit 1
          else
            V=$(dotnet --version)
            echo "✅ Installed: $V"
          fi

  # ══════════════════════════════════════════════════════════════════
  # COMBO 5 — rollForward latestMinor + dotnet-quality: daily
  # Question: does daily quality affect the global.json resolution?
  #
  # Expected:
  #   global.json 3.0.100 + latestMinor → 3.1.xxx
  #   dotnet-quality: daily → ignored for global.json (major <= 5)
  #   Warning logged: quality only works for major > 5
  # ══════════════════════════════════════════════════════════════════
  combo5-rollforward-latestMinor-quality-daily:
    name: "rollForward latestMinor + quality:daily | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: echo '{"sdk":{"version":"3.0.100","rollForward":"latestMinor"}}' > global.json

      - name: Setup dotnet (PR #538) + quality daily
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./global.json
          dotnet-quality: 'daily'
          # quality:daily ignored — 3.x major is < 5
          # rollForward still gives 3.1.xxx

      - name: Assert 3.1.xxx (rollForward unaffected, quality ignored)
        shell: bash
        run: |
          V=$(dotnet --version)
          if [[ ! "$V" =~ ^3\.1\. ]]; then
            echo "❌ Expected 3.1.xxx but got $V"; exit 1
          fi
          echo "✅ $V — quality:daily correctly ignored for major < 5"

  # ══════════════════════════════════════════════════════════════════
  # COMBO 6 — allowPrerelease: false in global.json + rollForward
  # This field is NOT read by PR #538
  # Question: does setup-dotnet respect allowPrerelease or ignore it?
  #
  # Expected (current): allowPrerelease silently ignored
  # Expected (ideal):   respect allowPrerelease when resolving rollForward
  # ══════════════════════════════════════════════════════════════════
  combo6-allowPrerelease-with-rollforward:
    name: "allowPrerelease:false + rollForward | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json with allowPrerelease false
        shell: bash
        run: |
          echo '{
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }' > global.json

      - name: Setup dotnet (PR #538)
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./global.json

      - name: Assert allowPrerelease behavior
        shell: bash
        run: |
          V=$(dotnet --version)
          echo "Installed: $V"
          if [[ "$V" == *"-"* ]]; then
            echo "⚠️ Got preview $V — allowPrerelease:false was IGNORED by PR #538"
            echo "   This is a known missing feature, not a regression"
          else
            echo "✅ $V is stable — allowPrerelease:false happened to be respected"
            echo "   (likely coincidence, not because PR #538 reads this field)"
          fi
      - run: dotnet build SampleApp/SampleApp.csproj && dotnet run --project SampleApp/SampleApp.csproj