name: Test preview install via official dotnet-install script

on:
  workflow_dispatch:
  push:
    

jobs:
  install-preview:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Create global.json with preview version + rollForward
        shell: bash
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "11.0.100-preview.4.26230.115",
              "allowPrerelease": false,
              "rollForward": "latestMajor"
            }
          }
          EOF
          echo "=== global.json ==="
          cat global.json

      # ---------- Linux / macOS ----------
      - name: Install via official install-dotnet.sh (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Read exact version from global.json
          VERSION=$(grep -oE '"version"[^,]*' global.json | head -1 | cut -d'"' -f4)
          echo "Parsed version: $VERSION"

          # Download the official installer script
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh

          INSTALL_DIR="$RUNNER_TEMP/dotnet"

          # Install the EXACT preview version (Approach 1 behavior)
          ./dotnet-install.sh \
            --version "$VERSION" \
            --install-dir "$INSTALL_DIR" \
            --skip-non-versioned-files \
            --verbose

          echo "=== Installed SDKs ==="
          "$INSTALL_DIR/dotnet" --list-sdks

      # ---------- Windows ----------
      - name: Install via official dotnet-install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = Get-Content global.json -Raw | ConvertFrom-Json
          $version = $json.sdk.version
          Write-Host "Parsed version: $version"

          Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1

          $installDir = Join-Path $env:RUNNER_TEMP 'dotnet'

          ./dotnet-install.ps1 `
            -Version $version `
            -InstallDir $installDir `
            -SkipNonVersionedFiles `
            -Verbose

          Write-Host "=== Installed SDKs ==="
          & "$installDir/dotnet.exe" --list-sdks

      - name: Verify the preview SDK is present
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            DOTNET="$RUNNER_TEMP/dotnet/dotnet.exe"
          else
            DOTNET="$RUNNER_TEMP/dotnet/dotnet"
          fi
          EXPECTED="11.0.100-preview.4.26230.115"
          if "$DOTNET" --list-sdks | grep -q "$EXPECTED"; then
            echo "✅ Preview SDK $EXPECTED installed successfully"
          else
            echo "❌ Preview SDK $EXPECTED NOT found"
            "$DOTNET" --list-sdks
            exit 1
          fi