name: Test SDK version formats (valid vs invalid per docs)

on:
  workflow_dispatch:
  push:

jobs:
  install-sdk:
    name: "${{ matrix.version_label }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version:
          - "11.0.100-preview.4.26230.115"
          - "10.0.300"
          - "8.0.100"
          - "10"
          - "10.0"
          - "10.0.x"
          - ">=10.0.100"
          - "99.0.100"
        include:
          - version: "11.0.100-preview.4.26230.115"
            version_label: "preview-full (valid)"
            expect_success: true
          - version: "10.0.300"
            version_label: "stable-full (valid)"
            expect_success: true
          - version: "8.0.100"
            version_label: "older-stable (valid)"
            expect_success: true
          - version: "10"
            version_label: "major-only (invalid)"
            expect_success: false
          - version: "10.0"
            version_label: "major.minor (invalid)"
            expect_success: false
          - version: "10.0.x"
            version_label: "wildcard (invalid)"
            expect_success: false
          - version: ">=10.0.100"
            version_label: "range (invalid)"
            expect_success: false
          - version: "99.0.100"
            version_label: "non-existent (invalid)"
            expect_success: false

    steps:
      - name: Create global.json
        shell: bash
        run: |
          cat > global.json <<EOF
          {
            "sdk": {
              "version": "${{ matrix.version }}"
            }
          }
          EOF
          echo "=== global.json ==="
          cat global.json

      - name: Install via dotnet-install.sh (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        id: install_nix
        run: |
          set -euo pipefail
          VERSION="${{ matrix.version }}"
          echo "Installing version: $VERSION"
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          INSTALL_DIR="$RUNNER_TEMP/dotnet"
          ./dotnet-install.sh \
            --version "$VERSION" \
            --install-dir "$INSTALL_DIR" \
            --skip-non-versioned-files \
            --verbose
          echo "=== Installed SDKs ==="
          "$INSTALL_DIR/dotnet" --list-sdks

      - name: Install via dotnet-install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        id: install_win
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ matrix.version }}"
          Write-Host "Installing version: $version"
          Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
          $installDir = Join-Path $env:RUNNER_TEMP 'dotnet'
          ./dotnet-install.ps1 `
            -Version $version `
            -InstallDir $installDir `
            -SkipNonVersionedFiles `
            -Verbose
          Write-Host "=== Installed SDKs ==="
          & "$installDir/dotnet.exe" --list-sdks

      - name: Verify result matches expectation
        shell: bash
        run: |
          set -euo pipefail
          EXPECT_SUCCESS="${{ matrix.expect_success }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            STEP_OUTCOME="${{ steps.install_win.outcome }}"
          else
            STEP_OUTCOME="${{ steps.install_nix.outcome }}"
          fi
          echo "Version: ${{ matrix.version }}"
          echo "Label: ${{ matrix.version_label }}"
          echo "Step outcome: $STEP_OUTCOME"
          echo "Expected success: $EXPECT_SUCCESS"
          if [ "$EXPECT_SUCCESS" = "true" ] && [ "$STEP_OUTCOME" = "success" ]; then
            echo "✅ PASS — Valid version installed successfully"
          elif [ "$EXPECT_SUCCESS" = "false" ] && [ "$STEP_OUTCOME" = "failure" ]; then
            echo "✅ PASS — Invalid version correctly rejected"
          else
            echo "❌ FAIL — Unexpected result"
            exit 1
          fi