name: test-multi-version-sts

on:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet multi-version with STS
        id: setup
        uses: mahabaleshwars/setup-dotnet@feature/497-dotnet-version-latest-keyword
        with:
          dotnet-version: |
            latest
            9.0.x
          dotnet-channel: sts

      - name: Verify version
        shell: bash
        run: |
          dotnet --version
          echo "resolved=${{ steps.setup.outputs.dotnet-version }}"