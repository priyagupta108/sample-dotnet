name: Test Invalid SDK Version

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create global.json with invalid version
        run: |
          echo '{ "sdk": { "version": "99.0.100" } }' > global.json

      - name: Run dotnet command
        run: dotnet build