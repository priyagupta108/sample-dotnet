name: Test Invalid SDK Format

on:
  # push:
  workflow_dispatch:

jobs:
 test-preview-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json
        shell: bash
        run: |
          echo '{"sdk":{"version":"11.0.100-preview.4.26230.115","rollForward":"latestFeature"}}' > global.json

      - name: Check version
        run: dotnet --info
        
 test-preview-format-invalid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json
        shell: bash
        run: |
          echo '{"sdk":{"version":"11.0.100-preview.4","rollForward":"latestFeature"}}' > global.json

      - name: Check version
        run: dotnet --info
 test-partial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json
        shell: bash
        run: |
          echo '{"sdk":{"version":"10","rollForward":"latestFeature"}}' > global.json
    

      - name: Check version
        run: dotnet --info

 test-two-part:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json
        shell: bash
        run: |
          echo '{"sdk":{"version":"10.0","rollForward":"latestFeature"}}' > global.json
    

      - name: Check version
        run: dotnet --info

 test-wildcard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json
        shell: bash
        run: |
            echo '{"sdk":{"version":"10.0.x","rollForward":"latestFeature"}}' > global.json
      
 test-major-minor-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json
        shell: bash
        run: |
            echo '{"sdk":{"version":"7.0.0","rollForward":"latestFeature"}}' > global.json
   
      - name: Check version
        run: dotnet --info
