name: "latestFeature"

on:
  push:
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════════
  # SCENARIO — latestFeature
  # Anchor: 11.0.100-preview.4.26230.115 | rollForward: latestFeature
  # Expected: 11.0.xxx (any feature band)
  # ══════════════════════════════════════════════════════════════════
  latestFeature:
    name: "latestFeature 11.0.100-preview.4.26230.115→11.0.xxx | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json
        shell: bash
        run: |
          echo '{"sdk":{"version":"11.0.100-preview.4.26230.115","rollForward":"latestFeature"}}' > global.json

      - name: Setup dotnet (PR#538)
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: ./global.json

      - name: Assert version is 11.0.xxx
        shell: bash
        run: |
          VERSION=$(dotnet --version)
          if [[ ! "$VERSION" =~ ^11\.0\. ]]; then
            echo "❌ FAIL: Expected 11.0.xxx but got $VERSION"; exit 1
          fi
          echo "✅ PASS: $VERSION"

      - name: Build and run
        run: |
          dotnet build SampleApp/SampleApp.csproj
          dotnet run --project SampleApp/SampleApp.csproj
