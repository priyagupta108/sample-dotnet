name: "rollForward + architecture"

on:
  # push:
  workflow_dispatch:

jobs:
  # global.json: 8.0.100 + latestPatch → installs 8.0.1xx
  # architecture: x64 explicitly
  # Expected: 8.0.1xx x64 SDK installed
  rollforward-with-architecture:
    name: "rollForward + arch x64 | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json
        shell: bash
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestPatch"}}' > global.json

      - name: Setup dotnet (x64)
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./global.json
          architecture: x64

      - name: Assert 8.0.1xx installed
        shell: bash
        run: |
          VERSION=$(dotnet --version)
          if [[ ! "$VERSION" =~ ^8\.0\.1[0-9]{2}$ ]]; then
            echo "❌ FAIL: Expected 8.0.1xx but got $VERSION"; exit 1
          fi
          echo "✅ PASS: $VERSION (x64)"

      - name: Build and run
        run: |
          dotnet build SampleApp/SampleApp.csproj
          dotnet run --project SampleApp/SampleApp.csproj