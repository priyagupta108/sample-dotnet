name: "auto-detect"

on:
  push:
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════════
  # SCENARIO 7 — Auto-detected global.json (no explicit input)
  # global.json written at repo root, no global-json-file input
  # setup-dotnet auto-discovers it
  # Expected: 8.x.xxx
  # ══════════════════════════════════════════════════════════════════
  auto-detect:
    name: "Auto-detect global.json | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6

      - name: Write global.json at repo root
        shell: bash
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestMinor"}}' > ./global.json

      - name: Setup dotnet — no global-json-file input (auto-detects)
        uses: js6pak/setup-dotnet@feat/support-rollForward

      - name: Assert version is 8.x.xxx
        shell: bash
        run: |
          VERSION=$(dotnet --version)
          if [[ ! "$VERSION" =~ ^8\. ]]; then
            echo "❌ FAIL: Expected 8.x.xxx but got $VERSION"; exit 1
          fi
          echo "✅ PASS: $VERSION — auto-detect worked"

      - name: Build and run
        run: |
          dotnet build SampleApp/SampleApp.csproj
          dotnet run --project SampleApp/SampleApp.csproj

      - name: Cleanup root global.json
        if: always()
        shell: bash
        run: rm -f ./global.json
