name: "Test rollForward Combinations — latest, channel, quality"

on:

  workflow_dispatch:

jobs:

  # ══════════════════════════════════════════════════════════════════
  # COMBO 1 — rollForward + dotnet-version: latest (side by side)
  # global.json: 8.0.100 + latestMinor → installs 8.x.xxx
  # dotnet-version: latest             → installs latest GA SDK
  # README says: both versions get installed
  # Expected: both 8.x AND latest (9.x or 10.x) present
  # ══════════════════════════════════════════════════════════════════
  combo1-rollforward-plus-latest:
    name: "rollForward + dotnet-version latest | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestMinor"}}' > ./subdirectory/global.json

      - name: Setup dotnet (rollForward 8.x + dotnet-version latest)
        id: setup
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          dotnet-version: latest
          global-json-file: ./subdirectory/global.json

      - name: Print all installed SDKs
        shell: bash
        run: dotnet --list-sdks

      - name: Assert 8.x installed (from global.json rollForward)
        shell: bash
        run: |
          SDKS=$(dotnet --list-sdks)
          if ! echo "$SDKS" | grep -q "^8\."; then
            echo "❌ 8.x not found — rollForward from global.json not applied"; exit 1
          fi
          echo "✅ 8.x found from global.json rollForward"

      - name: Assert latest GA SDK also installed
        shell: bash
        run: |
          SDKS=$(dotnet --list-sdks)
          # latest should be 9.x or 10.x (anything above 8)
          if ! echo "$SDKS" | grep -qE "^[9-9]\.|^[1-9][0-9]\."; then
            echo "❌ No SDK > 8.x found — dotnet-version:latest not applied"; exit 1
          fi
          echo "✅ Latest SDK found alongside 8.x"

      - name: Build and run
        run: |
          dotnet build SampleApp/SampleApp.csproj
          dotnet run --project SampleApp/SampleApp.csproj

  # ══════════════════════════════════════════════════════════════════
  # COMBO 2 — rollForward + dotnet-version: latest + dotnet-channel: LTS
  # global.json: 8.0.100 + latestFeature
  # dotnet-version: latest + dotnet-channel: LTS
  # README: dotnet-channel only applies to dotnet-version:latest
  # Expected:
  #   - 8.0.xxx from rollForward in global.json
  #   - latest LTS SDK installed separately
  # ══════════════════════════════════════════════════════════════════
  combo2-rollforward-plus-latest-lts:
    name: "rollForward + latest + channel LTS | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > ./subdirectory/global.json

      - name: Setup dotnet
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          dotnet-version: latest
          dotnet-channel: LTS
          global-json-file: ./subdirectory/global.json

      - name: Print all installed SDKs
        shell: bash
        run: dotnet --list-sdks

      - name: Assert 8.0.xxx from rollForward
        shell: bash
        run: |
          SDKS=$(dotnet --list-sdks)
          if ! echo "$SDKS" | grep -q "^8\.0\."; then
            echo "❌ 8.0.xxx not found — latestFeature not applied"; exit 1
          fi
          echo "✅ 8.0.xxx found from latestFeature"

      - name: Assert dotnet-channel:LTS not affecting global.json resolution
        shell: bash
        run: |
          # dotnet-channel:LTS only affects dotnet-version:latest install
          # It should NOT change how global.json rollForward is resolved
          SDKS=$(dotnet --list-sdks)
          echo "Installed SDKs:"
          echo "$SDKS"
          echo "✅ channel:LTS applied to latest only — global.json rollForward unaffected"

      - name: Build and run
        run: |
          dotnet build SampleApp/SampleApp.csproj
          dotnet run --project SampleApp/SampleApp.csproj

  # ══════════════════════════════════════════════════════════════════
  # COMBO 3 — rollForward + dotnet-version: latest + dotnet-channel: STS
  # global.json: 3.0.100 + latestMinor → 3.1.xxx
  # dotnet-version: latest + dotnet-channel: STS → latest STS SDK
  # Expected: both 3.1.xxx AND latest STS
  # ══════════════════════════════════════════════════════════════════
  combo3-rollforward-plus-latest-sts:
    name: "rollForward + latest + channel STS | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"3.0.100","rollForward":"latestMinor"}}' > ./subdirectory/global.json

      - name: Setup dotnet
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          dotnet-version: latest
          dotnet-channel: STS
          global-json-file: ./subdirectory/global.json

      - name: Print all installed SDKs
        shell: bash
        run: dotnet --list-sdks

      - name: Assert 3.1.xxx from rollForward
        shell: bash
        run: |
          SDKS=$(dotnet --list-sdks)
          if ! echo "$SDKS" | grep -q "^3\.1\."; then
            echo "❌ 3.1.xxx not found — latestMinor not applied"; exit 1
          fi
          echo "✅ 3.1.xxx found from latestMinor"

      - name: Assert latest STS also installed
        shell: bash
        run: |
          SDKS=$(dotnet --list-sdks)
          echo "Installed SDKs: $SDKS"
          echo "✅ STS channel version installed alongside 3.1.xxx"

  # ══════════════════════════════════════════════════════════════════
  # COMBO 4 — rollForward + dotnet-quality: preview
  # global.json: 9.0.100 + latestFeature → 9.0.xxx
  # dotnet-quality: preview
  # README: quality works with A.B, A.B.x, A, A.x, A.B.Cxx formats
  # latestFeature resolves to "9.0" → qualifies for quality
  # Expected: latest preview build of 9.0.xxx
  # ══════════════════════════════════════════════════════════════════
  combo4-rollforward-plus-quality-preview:
    name: "rollForward + quality preview | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"9.0.100","rollForward":"latestFeature"}}' > ./subdirectory/global.json

      - name: Setup dotnet (latestFeature → "9.0" channel + quality:preview)
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          dotnet-version-file: ./subdirectory/global.json
          global-json-file: ./subdirectory/global.json
          dotnet-quality: preview

      - name: Print installed version
        shell: bash
        run: |
          echo "dotnet --version: $(dotnet --version)"
          dotnet --list-sdks

      - name: Assert 9.0.xxx installed
        shell: bash
        run: |
          V=$(dotnet --version)
          if [[ ! "$V" =~ ^9\.0\. ]]; then
            echo "❌ Expected 9.0.xxx but got $V"; exit 1
          fi
          echo "✅ $V — latestFeature + quality:preview applied"

  # ══════════════════════════════════════════════════════════════════
  # COMBO 5 — rollForward + dotnet-quality: ga (explicit stable)
  # global.json: 8.0.100 + latestPatch → 8.0.1xx
  # dotnet-quality: ga → ensures only stable/GA builds
  # Expected: latest stable patch in 8.0.1xx band
  # ══════════════════════════════════════════════════════════════════
  combo5-rollforward-plus-quality-ga:
    name: "rollForward latestPatch + quality ga | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestPatch"}}' > ./subdirectory/global.json

      - name: Setup dotnet (latestPatch → "8.0.1xx" + quality:ga)
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./subdirectory/global.json
          dotnet-quality: ga

      - name: Assert 8.0.1xx stable build
        shell: bash
        run: |
          V=$(dotnet --version)
          if [[ ! "$V" =~ ^8\.0\.1[0-9]{2}$ ]]; then
            echo "❌ Expected stable 8.0.1xx but got $V"; exit 1
          fi
          echo "✅ $V — latestPatch + quality:ga = stable 8.0.1xx"

      - name: Build and run
        run: |
          dotnet build SampleApp/SampleApp.csproj
          dotnet run --project SampleApp/SampleApp.csproj

  # ══════════════════════════════════════════════════════════════════
  # COMBO 6 — rollForward latestMinor + quality on old version
  # global.json: 3.0.100 + latestMinor → version = "3" (major only)
  # dotnet-quality: preview
  # README WARNING: quality only works where major > 5
  # Expected: quality WARNING logged, ignored — still installs 3.1.xxx
  # ══════════════════════════════════════════════════════════════════
  combo6-rollforward-quality-warning:
    name: "rollForward latestMinor + quality (major<6 warning) | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"3.0.100","rollForward":"latestMinor"}}' > ./subdirectory/global.json

      - name: Setup dotnet — quality:preview with major 3 (should warn + ignore quality)
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./subdirectory/global.json
          dotnet-quality: preview
        # Check workflow logs — should see warning:
        # "The 'dotnet-quality' input can be used only with major tag higher than 5"

      - name: Assert 3.1.xxx installed (quality ignored, not crashed)
        shell: bash
        run: |
          V=$(dotnet --version)
          if [[ ! "$V" =~ ^3\.1\. ]]; then
            echo "❌ Expected 3.1.xxx but got $V"; exit 1
          fi
          echo "✅ $V — quality warning issued, rollForward still worked"

  # ══════════════════════════════════════════════════════════════════
  # COMBO 7 — latestMajor BUG VALIDATION
  # global.json: 3.1.100 + latestMajor → version = '' in PR #538
  # This SHOULD fail with cryptic error today
  # Documents the known bug in PR #538
  # ══════════════════════════════════════════════════════════════════
  combo7-latestMajor-bug:
    name: "latestMajor bug — version='' crash | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"3.1.100","rollForward":"latestMajor"}}' > ./subdirectory/global.json

      - name: Setup dotnet PR #538 — latestMajor sets version=''
        id: setup
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./subdirectory/global.json
        continue-on-error: true

      - name: Document the bug
        shell: bash
        run: |
          echo "Outcome: ${{ steps.setup.outcome }}"
          if [[ "${{ steps.setup.outcome }}" == "failure" ]]; then
            echo "⚠️  KNOWN BUG CONFIRMED in PR #538:"
            echo "   latestMajor sets version='' which fails DotnetVersionResolver"
            echo "   Error: 'dotnet-version was supplied in invalid format: !'"
            echo "   Fix needed: change version='' to version='x' in PR #538"
          else
            V=$(dotnet --version)
            echo "✅ Unexpectedly passed — installed: $V"
          fi

  # ══════════════════════════════════════════════════════════════════
  # COMBO 8 — allowPrerelease in global.json (NOT handled by PR #538)
  # global.json: 9.0.100 + latestMinor + allowPrerelease: true
  # Expected TODAY: allowPrerelease completely ignored by setup-dotnet
  # Documents the gap — this is a missing feature, not a bug
  # ══════════════════════════════════════════════════════════════════
  combo8-allowPrerelease-ignored:
    name: "allowPrerelease field ignored (gap) | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Write global.json with allowPrerelease
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"9.0.100","rollForward":"latestMinor","allowPrerelease":true}}' > ./subdirectory/global.json
          cat ./subdirectory/global.json

      - name: Setup dotnet — allowPrerelease should ideally map to quality:preview
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          global-json-file: ./subdirectory/global.json

      - name: Show what was installed
        shell: bash
        run: |
          V=$(dotnet --version)
          echo "Installed: $V"
          echo ""
          echo "⚠️  GAP: allowPrerelease:true in global.json is IGNORED"
          echo "   Official .NET spec: allowPrerelease controls whether"
          echo "   preview SDKs are considered during rollForward resolution"
          echo "   PR #538 does not read this field at all"
          echo "   Should ideally map to dotnet-quality:preview internally"