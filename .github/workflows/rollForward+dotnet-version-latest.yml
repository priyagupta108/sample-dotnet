name: "rollForward + dotnet-version:latest"
# global.json: 8.0.100 + latestMinor → 8.x.xxx
# dotnet-version: latest             → latest GA
# Expected: BOTH 8.x AND latest (9.x or 10.x) present
on:
  push:
  workflow_dispatch:
jobs:
  rf-dotnet-version-latest:
    name: "latestMinor + dotnet-version:latest | ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json
        shell: bash
        run: |
          mkdir -p subdirectory
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestMinor"}}' > ./subdirectory/global.json
      - name: Setup dotnet
        id: setup
        uses: js6pak/setup-dotnet@feat/support-rollForward
        with:
          dotnet-version: latest
          global-json-file: ./subdirectory/global.json
      - name: Assert 8.x from rollForward
        shell: bash
        run: |
          SDKS=$(dotnet --list-sdks)
          if ! echo "$SDKS" | grep -q "^8\."; then
            echo "❌ 8.x not found"; exit 1
          fi
          echo "✅ 8.x present"
      - name: Assert latest GA also installed
        shell: bash
        run: |
          SDKS=$(dotnet --list-sdks)
          if ! echo "$SDKS" | grep -qE "^9\.|^[1-9][0-9]\."; then
            echo "❌ No SDK > 8.x found"; exit 1
          fi
          echo "✅ Latest GA present"
      - run: dotnet build SampleApp/SampleApp.csproj && dotnet run --project SampleApp/SampleApp.csproj